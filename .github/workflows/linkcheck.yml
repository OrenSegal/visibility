name: linkcheck
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths: [skills/plan/catalog.json, .github/linkcheck.py, .github/workflows/linkcheck.yml]
permissions:
  contents: read
jobs:
  submit-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 .github/linkcheck.py
